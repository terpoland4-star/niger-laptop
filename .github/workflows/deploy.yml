name: Deploy niger-laptops
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            set -e
            cd ~/niger-laptop
            git pull origin main
            # FIX: pnpm pas npm
            pnpm install --frozen-lockfile
            pnpm run build
            # FIX: bon nom pm2
            pm2 delete niger-laptops-api || true
            pm2 delete niger-laptops || true
            pm2 start dist/index.js --name niger-laptops --cwd /home/nigerlaptops/niger-laptop --update-env
            pm2 save
            pm2 status
            pm2 logs niger-laptops --lines 20 --nostream
