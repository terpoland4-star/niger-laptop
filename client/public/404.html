<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Redirection... - Niger Laptops</title>
  <script type="text/javascript">
    // Méthode robuste pour SPA sur GitHub Pages avec historique HTML5 (wouter/react-router)
    var path = window.location.pathname;
    var search = window.location.search;
    var hash = window.location.hash;
    
    // Si on n'est pas déjà à la racine, on sauvegarde le chemin et on redirige
    if (path !== '/' && path !== '/index.html') {
      sessionStorage.setItem('gh_pages_spa_redirect', path + search + hash);
      window.location.replace('/');
    }
  </script>
  <style>
    body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: system-ui, sans-serif; background: #f9fafb; }
    .spinner { border: 4px solid #f3f4f6; border-top: 4px solid #0ea5e9; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div style="text-align: center;">
    <div class="spinner"></div>
    <p style="color: #6b7280; margin: 0;">Redirection en cours...</p>
  </div>
</body>
</html>
